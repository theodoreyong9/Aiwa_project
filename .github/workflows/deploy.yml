name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Regenerate PWA icons (deterministic — checked in, this just verifies)
        run: |
          node scripts/generate-icons.mjs
          git diff --exit-code -- icons/
      - name: Assemble the static site
        run: |
          mkdir _site
          cp index.html style.css manifest.webmanifest sw.js _site/
          cp -r icons _site/icons
          cp -r examples _site/examples
          cp -r node_modules _site/node_modules
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
